  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="logo" href="index.html"><img class="logo-mark" src="images/favicon.svg" alt="ひなた小児科クリニックのロゴ"><span><small>HINATA PEDIATRIC CLINIC</small>ひなた小児科クリニック</span></a>
        <div class="header-actions">
          <div class="header-contact">☎ <strong>03-1234-5678</strong></div>
          <button class="header-booking" type="button" disabled aria-label="ネット予約（準備中）">ネット予約<small>準備中</small></button>
        </div>
      </div>
      <nav class="main-nav" aria-label="メインナビゲーション">
        <ul>
          <li><a href="index.html">ホーム</a></li>
          <li><a href="medical.html">診療内容</a></li>
          <li><a href="about.html">クリニック紹介</a></li>
          <li><a href="doctor.html">医師紹介</a></li>
          <li><a href="news.html">お知らせ</a></li>

          <li><a href="access.html">アクセス</a></li>
          <li><a href="contact.html" aria-current="page">お問い合わせ</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="page-hero">
        <div class="container">
          <h1>お問い合わせ</h1>
          <p>ご質問やご相談は、こちらからお送りください。</p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <p class="center">※こちらはお問い合わせフォームの表示サンプルです。送信機能はありません。</p>
          <form class="form" action="#" method="post">
            <div class="form-row"><label for="name">お名前<span class="required">必須</span></label><input id="name" name="name" type="text" required></div>
            <div class="form-row"><label for="email">メールアドレス<span class="required">必須</span></label><input id="email" name="email" type="email" required></div>
            <div class="form-row"><label for="tel">電話番号</label><input id="tel" name="tel" type="tel"></div>
            <div class="form-row"><label for="message">お問い合わせ内容<span class="required">必須</span></label><textarea id="message" name="message" required></textarea></div>
            <fieldset class="form-row">
              <legend>個人情報保護についての同意<span class="required">必須</span></legend>
              <label class="check"><input type="checkbox" required><span>個人情報の取り扱いに同意します。</span></label>
            </fieldset>
            <button class="button" type="button" aria-label="送信ボタン（送信機能は実装されていません）">送信する</button>
          </form>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container">
        <a class="logo" href="index.html"><img class="logo-mark" src="images/favicon.svg" alt="ひなた小児科クリニックのロゴ"><span>ひなた小児科クリニック</span></a>
        <p>〒123-4567 愛知県中区錦　☎ 03-1234-5678</p>
        <p><a href="access.html">アクセス</a>　<a href="medical.html">診療内容</a></p>
        <div class="copyright">© Hinata Pediatric Clinic</div>
      </div>
    </footer>
  </body>
</html>
